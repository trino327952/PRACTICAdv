name: CI Proyecto Full Stack

on:
  push:
    branches:
      - main
      - "feat/**"

  pull_request:
    branches:
      - main

jobs:

  validar-backend:
    name: Validar Backend
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci
       

      - name: Generar cliente Prisma
        working-directory: ./backend
        run: npx prisma generate

      - name: Ejecutar pruebas Backend
        working-directory: ./backend
        run: npx vitest run --passWithNoTests

      - name: Verificar calidad Backend
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Construir Backend
        working-directory: ./backend
        run: npm run build --if-present


  validar-frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar pruebas Frontend
        working-directory: ./frontend
        run: npm test --if-present

      - name: Verificar calidad Frontend
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Construir Frontend
        working-directory: ./frontend
        run: npm run build
